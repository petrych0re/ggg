name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    paths:
      - "windows-control/**"
      - ".github/workflows/build-windows-control.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build desktop controller
        run: pyinstaller --noconfirm --clean --onefile --windowed --name TelegramAIControl windows-control/control_app.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: TelegramAIControl-Windows
          path: dist/TelegramAIControl.exe
          if-no-files-found: error
