name: Archive Township Analysis Source

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  push:
    paths:
      - ".github/workflows/archive-township-source.yml"

permissions:
  contents: write

jobs:
  archive-source:
    runs-on: ubuntu-latest
    steps:
      - name: Download upstream source archive
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://github.com/Gaolious/analysis-township/archive/refs/heads/develop.zip" \
            --output township-analysis-develop.zip
          test -s township-analysis-develop.zip
      - name: Upload temporary workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: township-analysis-develop-source
          path: township-analysis-develop.zip
          if-no-files-found: error
          retention-days: 30
      - name: Publish persistent archive release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view township-source-archive >/dev/null 2>&1; then
            gh release create township-source-archive \
              --title "Township Analysis Source Archive" \
              --notes "Archive of source from https://github.com/Gaolious/analysis-township/tree/develop. Upstream project is licensed under GPL-3.0; retain and follow its license and notices when redistributing."
          fi
          gh release upload township-source-archive township-analysis-develop.zip --clobber
